name: Sync local game content

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-local-game-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh local content
        run: node scripts/sync-content.mjs

      - name: Commit changed local content
        shell: bash
        run: |
          git add --all -- index.html assets/js/local-content.js assets/js/local-registrations.js
          git add --all -- Pics/Synced 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Source content is unchanged; no commit is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync local game content"
          git push
